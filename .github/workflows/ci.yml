name: Build VioletCore

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Configure Git
        run: git config --global user.email "no-reply@github.com" && git config --global user.name "GitHub Actions"

      - name: Validate core-server repository
        run: |
          test ! -f app.py
          test ! -f requirements.txt
          test -f purpur-server/paper-patches/features/0006-VioletCore-engine-plugin-loader.patch
          test -f purpur-server/minecraft-patches/features/0022-VioletCore-engine-plugin-hooks.patch
          test -f purpur-api/paper-patches/features/0003-VioletCore-Engine-Plugin-API.patch

      - name: Apply patches
        run: ./gradlew --no-daemon --max-workers=2 applyAllPatches

      - name: Compile
        run: ./gradlew --no-daemon --max-workers=2 :purpur-api:compileJava :purpur-server:compileJava

      - name: Build runnable jar
        run: ./gradlew --no-daemon --max-workers=2 :purpur-server:createBundlerJar -x test

      - name: Build SmartEntityTick
        run: |
          mkdir -p build/smartentitytick/classes
          CP="$(ls purpur-api/build/libs/purpur-api-*.jar):$(find ~/.gradle/caches/modules-2/files-2.1 -name '*.jar' | tr '\n' ':')"
          javac --release 25 -cp "$CP" -d build/smartentitytick/classes $(find examples/smart-entity-tick/src/main/java -name '*.java')
          cp examples/smart-entity-tick/engine-plugin.yml build/smartentitytick/classes/engine-plugin.yml
          jar --create --file build/libs/SmartEntityTick-$(grep '^version:' examples/smart-entity-tick/engine-plugin.yml | awk '{print $2}').jar -C build/smartentitytick/classes .

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VioletCore-dev-artifacts
          path: |
            purpur-server/build/libs/*bundler*.jar
            purpur-api/build/libs/*.jar
            build/libs/SmartEntityTick-*.jar
